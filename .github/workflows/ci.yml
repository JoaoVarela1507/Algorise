name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}

      # TODO(#14): rodar `npm run test` (Vitest) quando a suíte existir.

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Sobe o servidor de verdade em vez de usar o TestClient, que exigiria
      # httpx só para o CI.
      - name: Smoke da API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      # TODO(#13): rodar `ruff check .` quando o Ruff estiver configurado.
      # TODO(#14): rodar `pytest` quando a suíte existir.

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build do backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: algorise-backend:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build do frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: algorise-frontend:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build que compila não garante imagem que sobe: as duas são executadas.
      - name: Backend sobe e responde
        run: |
          docker run -d --name backend-ci -p 8000:8000 algorise-backend:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && echo && exit 0
            sleep 2
          done
          echo "backend não respondeu a tempo"
          docker logs backend-ci
          exit 1

      - name: Frontend sobe e serve o index
        run: |
          docker run -d --name frontend-ci -p 8080:80 algorise-frontend:ci
          for _ in $(seq 1 15); do
            curl -fsS http://localhost:8080/ > /dev/null && echo "frontend ok" && exit 0
            sleep 2
          done
          echo "frontend não respondeu a tempo"
          docker logs frontend-ci
          exit 1

      - name: Validar os arquivos do compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml config --quiet

  # TODO(#14): job de E2E com Playwright, depois que a suíte existir.
