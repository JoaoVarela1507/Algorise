name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      # Só o que vai para o navegador do aluno (#40). As ferramentas de build
      # (vite, esbuild) ficam de fora: o problema delas é no servidor de dev,
      # não no bundle, e subir de versão maior é uma mudança à parte.
      - name: Dependências vulneráveis (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Testes (Vitest)
        run: npm run test:cov

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Banco descartável: as migrações rodam contra um PostgreSQL de verdade,
      # não contra SQLite, senão o CI não pega erro específico do Postgres.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: algorise
          POSTGRES_PASSWORD: algorise
          POSTGRES_DB: algorise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algorise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A sessão (refresh token) vive no Redis: sem ele o smoke de auth não abre
      # sessão nenhuma.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://algorise:algorise@localhost:5432/algorise
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint e formatação (Ruff)
        run: |
          ruff check .
          ruff format --check .

      # PYSEC-2026-1325 (CVE-2024-23342, "Minerva") é um ataque de tempo na
      # assinatura ECDSA do pacote `ecdsa`, que entra pelo python-jose. A API só
      # assina com HS256, então esse código nunca roda, e o mantenedor não vai
      # corrigir. Sai daqui se o JWT passar a usar ES256 ou se a lib for trocada.
      - name: Dependências vulneráveis (pip-audit)
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      # Ida e volta completa: se o downgrade estiver quebrado, o CI reprova.
      - name: Migrações
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # No Supabase, tabela sem RLS fica legível pela Data API com a chave anon,
      # que é pública. Toda migração que cria tabela precisa ligar o RLS nela.
      - name: RLS em todas as tabelas
        run: |
          python - <<'PY'
          import sys
          import psycopg
          from app.core.config import settings

          url = settings.database_url.replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url) as conexao:
              sem_rls = [linha[0] for linha in conexao.execute(
                  "SELECT relname FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace"
                  " WHERE n.nspname = 'public' AND c.relkind = 'r' AND NOT c.relrowsecurity"
              )]
          if sem_rls:
              sys.exit(f"Tabelas sem RLS: {', '.join(sem_rls)}")
          print("RLS ligado em todas as tabelas")
          PY

      - name: Seed
        run: |
          python -m app.seeds
          python -m app.seeds  # roda duas vezes: precisa ser idempotente

      # Sobe o servidor de verdade em vez de usar o TestClient, que exigiria
      # httpx só para o CI.
      - name: Smoke da API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ready | tee /dev/stderr | grep -q '"banco":"ok"'
          # A rota de trilhas precisa devolver o que o seed inseriu.
          curl -fsS http://127.0.0.1:8000/api/v1/trilhas | tee /dev/stderr | grep -q 'introducao-python'
          # Autenticação: registrar, entrar e usar o token numa rota protegida,
          # o caminho que a #10 pede. Sem token, a mesma rota precisa recusar.
          json='Content-Type: application/json'
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/register -H "$json" \
            -d '{"username":"ci_smoke","email":"ci@algorise.dev","senha":"senha-do-ci","aceite_termos":true}' > /dev/null
          token=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login -H "$json" \
            -d '{"email":"ci@algorise.dev","senha":"senha-do-ci"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://127.0.0.1:8000/api/v1/auth/eu -H "Authorization: Bearer $token" \
            | tee /dev/stderr | grep -q '"username":"ci_smoke"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/auth/eu)" = 401

      # O `frontend/src/types/api.d.ts` é gerado do OpenAPI e commitado, para o
      # frontend compilar sem Python. Se alguém mexe numa rota e esquece de
      # rodar `npm run gen:api`, o tipo no frontend passa a mentir — e é só no
      # runtime que aparece. Aqui isso reprova o PR.
      - name: OpenAPI commitado está atualizado
        working-directory: .
        run: |
          python backend/scripts/exportar_openapi.py
          git diff --exit-code frontend/src/types/openapi.json             || { echo "::error::Rode 'npm run gen:api' e commite o resultado"; exit 1; }

      # A suíte usa SQLite e `fakeredis`, então não depende dos serviços acima;
      # eles continuam existindo para as migrações e o smoke.
      - name: Testes (Pytest)
        run: pytest --cov=app --cov-report=term --cov-fail-under=80

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      # A sessão vive no Redis e falha fechado sem ele (#12): sem esse serviço
      # não há cadastro nem login, e o E2E não sai do lugar.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - run: npm ci
        working-directory: frontend

      # Só o Chromium: três navegadores triplicariam o tempo sem mudar o que
      # este E2E verifica, que é a conversa entre frontend e API.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Testes E2E
        run: npm run test:e2e
        working-directory: frontend
        env:
          REDIS_URL: redis://127.0.0.1:6379/1

      - name: Relatório do que falhou
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build do backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: algorise-backend:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build do frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: algorise-frontend:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build que compila não garante imagem que sobe: as duas são executadas.
      - name: Backend sobe e responde
        run: |
          docker run -d --name backend-ci -p 8000:8000 algorise-backend:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && echo && exit 0
            sleep 2
          done
          echo "backend não respondeu a tempo"
          docker logs backend-ci
          exit 1

      - name: Frontend sobe e serve o index
        run: |
          docker run -d --name frontend-ci -p 8080:80 algorise-frontend:ci
          for _ in $(seq 1 15); do
            curl -fsS http://localhost:8080/ > /dev/null && echo "frontend ok" && exit 0
            sleep 2
          done
          echo "frontend não respondeu a tempo"
          docker logs frontend-ci
          exit 1

      - name: Validar os arquivos do compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml config --quiet

  # TODO(#14): job de E2E com Playwright, depois que a suíte existir.
