name: Qodana

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    # Análise complementar: não deve travar merge. O portão obrigatório é o
    # workflow CI (ESLint, Ruff, testes e build).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Análise Qodana
        uses: JetBrains/qodana-action@v2025.1
        env:
          # Sem o secret a análise roda mesmo assim, só não publica no Qodana
          # Cloud. Para publicar, crie QODANA_TOKEN nos secrets do repositório.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
