# Definição base do stack (perfil de produção).
#
#   docker compose up            -> dev, com hot reload (aplica o override abaixo)
#   docker compose -f docker-compose.yml up --build   -> produção, sem override
#
# O arquivo docker-compose.override.yml é carregado automaticamente e ajusta
# estes serviços para desenvolvimento.

services:
  db:
    # PostgreSQL 17 com a extensão `vector`, que o vault das skills (#200) usa
    # para a busca por similaridade. O Supabase já traz a mesma extensão.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algorise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algorise}
      POSTGRES_DB: ${POSTGRES_DB:-algorise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-algorise}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # IA do chat (#11). O modelo mora no volume: sem ele, recriar o container
  # baixaria de novo uns 2 GB. Sem porta no host de propósito, porque só o
  # backend fala com ele. Com GPU NVIDIA, veja o backend/README.md.
  ollama:
    image: ollama/ollama:0.40.11
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Baixa os modelos uma vez e sai; com eles já no volume, só confere e
  # termina. Sem isso o Ollama sobe vazio e todo chat responde 503. O segundo é
  # o de embedding, que o vault das skills (#200) usa.
  ollama-modelo:
    image: ollama/ollama:0.40.11
    entrypoint:
      - sh
      - -c
      # Sem internet, o `pull` falha mesmo com o modelo já baixado: o `show`
      # confere que ele existe no volume, e o worker sobe assim mesmo.
      - >-
        for modelo in ${OLLAMA_MODELO:-llama3.2} ${OLLAMA_MODELO_TAREFAS:-llama3.2}
        ${OLLAMA_MODELO_EMBEDDING:-bge-m3}; do
        ollama pull $$modelo || ollama show $$modelo > /dev/null || exit 1;
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: ./backend
      target: api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    # Aplica as migrações pendentes antes de aceitar tráfego.
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # O mesmo ambiente vale para o `worker` (abaixo), que roda o mesmo código.
    environment: &ambiente-backend
      ENVIRONMENT: ${ENVIRONMENT:-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      # Sem DATABASE_URL no .env da raiz, usa o PostgreSQL do serviço `db`. Com
      # ela (ex.: o Supabase), o backend usa esse banco e o `db` fica ocioso.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-algorise}:${POSTGRES_PASSWORD:-algorise}@db:5432/${POSTGRES_DB:-algorise}}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODELO: ${OLLAMA_MODELO:-llama3.2}
      # Modelo das tarefas do worker (leitura da ementa, vídeos, exercícios).
      # O padrão é o mesmo do chat: o llama3.2:1b foi testado na leitura do PPC
      # e devolveu JSON quebrado, sem ganhar tempo.
      OLLAMA_MODELO_TAREFAS: ${OLLAMA_MODELO_TAREFAS:-llama3.2}
      OLLAMA_MODELO_EMBEDDING: ${OLLAMA_MODELO_EMBEDDING:-bge-m3}
      # O trabalho longo (a leitura da ementa) vai para a fila do RQ, e o
      # `worker` o executa fora da API (#206).
      FILA: redis
      # Busca de vídeos para as lacunas (#207). Sem a chave, fica desligada.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Observabilidade (#39): sem o DSN, sem Sentry; sem o token, `/metrics` aberto.
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICAS_TOKEN: ${METRICAS_TOKEN:-}
      # Sandbox do desafio de código (#34). `runsc` (gVisor) isola o kernel também.
      SANDBOX_MODO: ${SANDBOX_MODO:-docker}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      # Sem valor no ambiente, o perfil de produção não sobe — de propósito.
      JWT_SECRET: ${JWT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # Fotos do perfil: sem o volume, recriar o container apagaria todas.
    volumes:
      - midia:/app/media
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Só iniciado, não saudável: a IA fora deixa o chat em 503, mas o resto
      # da API não tem por que esperar por ela.
      ollama:
        condition: service_started
    restart: unless-stopped

  # Executa as tarefas da fila (#206): a leitura da ementa, e depois a busca e a
  # transcrição dos vídeos. Mesma imagem e mesmo ambiente do backend, outro
  # comando. `--with-scheduler` é o que reenfileira a tarefa que falhou depois
  # do intervalo da nova tentativa.
  worker:
    build:
      context: ./backend
      # Com o yt-dlp e o Whisper, que a API não precisa.
      target: worker
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    command: rq worker algorise --url redis://redis:6379/0 --with-scheduler
    environment: *ambiente-backend
    # Lê o PDF que o backend gravou no volume. O modelo do Whisper fica no
    # outro: sem ele, recriar o container baixaria de novo uns 500 MB.
    volumes:
      - midia:/app/media
      - modelos_whisper:/app/modelos
      # A sandbox do desafio (#34) sobe os containers pelo Docker do host. Quem
      # fala com este socket manda no Docker: em produção, prefira o gVisor
      # (`SANDBOX_RUNTIME=runsc`) ou um Docker rootless só para a sandbox.
      - /var/run/docker.sock:/var/run/docker.sock
    # O dono do socket é o grupo `docker` do host; o worker roda sem root.
    group_add:
      - '${DOCKER_GID:-0}'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Saudável é o backend que já aplicou as migrações.
      backend:
        condition: service_healthy
      # O modelo das tarefas precisa estar baixado: sem esperar, a primeira
      # tarefa que pega o worker recém-criado falha com "model not found".
      ollama-modelo:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  midia:
  ollama_data:
  modelos_whisper:
