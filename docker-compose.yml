# Definição base do stack (perfil de produção).
#
#   docker compose up            -> dev, com hot reload (aplica o override abaixo)
#   docker compose -f docker-compose.yml up --build   -> produção, sem override
#
# O arquivo docker-compose.override.yml é carregado automaticamente e ajusta
# estes serviços para desenvolvimento.

services:
  db:
    # PostgreSQL 17 com a extensão `vector`, que o vault das skills (#200) usa
    # para a busca por similaridade. O Supabase já traz a mesma extensão.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algorise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algorise}
      POSTGRES_DB: ${POSTGRES_DB:-algorise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-algorise}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # IA do chat (#11). O modelo mora no volume: sem ele, recriar o container
  # baixaria de novo uns 2 GB. Sem porta no host de propósito, porque só o
  # backend fala com ele. Com GPU NVIDIA, veja o backend/README.md.
  ollama:
    image: ollama/ollama:0.40.11
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Baixa os modelos uma vez e sai; com eles já no volume, só confere e
  # termina. Sem isso o Ollama sobe vazio e todo chat responde 503. O segundo é
  # o de embedding, que o vault das skills (#200) usa.
  ollama-modelo:
    image: ollama/ollama:0.40.11
    entrypoint:
      - sh
      - -c
      - ollama pull ${OLLAMA_MODELO:-llama3.2} && ollama pull ${OLLAMA_MODELO_EMBEDDING:-bge-m3}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    # Aplica as migrações pendentes antes de aceitar tráfego.
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      # Sem DATABASE_URL no .env da raiz, usa o PostgreSQL do serviço `db`. Com
      # ela (ex.: o Supabase), o backend usa esse banco e o `db` fica ocioso.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-algorise}:${POSTGRES_PASSWORD:-algorise}@db:5432/${POSTGRES_DB:-algorise}}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODELO: ${OLLAMA_MODELO:-llama3.2}
      OLLAMA_MODELO_EMBEDDING: ${OLLAMA_MODELO_EMBEDDING:-bge-m3}
      # Sem valor no ambiente, o perfil de produção não sobe — de propósito.
      JWT_SECRET: ${JWT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # Fotos do perfil: sem o volume, recriar o container apagaria todas.
    volumes:
      - midia:/app/media
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Só iniciado, não saudável: a IA fora deixa o chat em 503, mas o resto
      # da API não tem por que esperar por ela.
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  midia:
  ollama_data:
