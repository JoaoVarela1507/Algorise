server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: qualquer rota do react-router cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets têm hash no nome, então podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index e o version.json precisam ser revalidados a cada deploy,
    # senão o navegador continua servindo a versão antiga.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
    }
}
