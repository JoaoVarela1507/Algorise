# Ajustes de desenvolvimento, carregados automaticamente pelo `docker compose up`:
# hot reload nos dois lados e portas do banco e do Redis expostas no host.

services:
  db:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  backend:
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: development
      FRONTEND_ORIGIN: http://localhost:5173
      # Pelo mesmo motivo do VITE_USE_POLLING, abaixo: sem polling, o --reload
      # não percebe a edição feita no Windows.
      WATCHFILES_FORCE_POLLING: 'true'
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      target: dev
    # O `node_modules` mora num volume nomeado (ver abaixo), que o Docker
    # popula **uma vez** e nunca mais atualiza: `up --build` reconstrói a imagem
    # e o container continua vendo as dependências antigas. O sintoma aparece
    # longe daqui — "Failed to resolve import" numa biblioteca que está no
    # package.json. Reconciliar na subida custa segundos e evita isso.
    #
    # `--no-save` para a instalação não reescrever o `package-lock.json` que
    # está montado do host.
    command: sh -c "npm install --no-save && npm run dev -- --host 0.0.0.0"
    ports: !override
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:8000
      # A pasta montada do Windows não gera evento de mudança dentro do
      # container; sem polling o hot reload não acontece (ver vite.config.ts).
      VITE_USE_POLLING: 'true'
    volumes:
      - ./frontend:/app
      # O node_modules vem da imagem (o volume é populado no primeiro up) e não
      # do host, que no Windows tem binários incompatíveis com o container.
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
